<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-96">
    <h1 class="text-3xl font-bold text-center mb-8">Inbox Manager</h1>
    <input id="username" type="text" placeholder="Username = admin" class="w-full p-4 border-2 mb-4 rounded-xl">
    <input id="password" type="password" placeholder="Password = password" class="w-full p-4 border-2 mb-6 rounded-xl">
    <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl text-xl font-bold">Login</button>
    <p id="error" class="text-red-500 text-center mt-4 hidden">Wrong username or password</p>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard.html';
      } else {
        document.getElementById('error').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
