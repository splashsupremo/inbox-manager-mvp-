<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Connect Inbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-2">Connect Microsoft Inbox</h1>
    <p class="text-center text-gray-600 mb-8">Follow the 3 steps</p>

    <div id="codeArea" class="hidden">
      <label class="block text-sm mb-2">Your code</label>
      <div class="flex gap-3">
        <input id="codeBox" readonly class="flex-1 text-4xl font-mono text-center border-2 border-dashed p-6 rounded-2xl">
        <button onclick="copyCode()" class="px-8 bg-blue-600 text-white rounded-2xl">Copy</button>
      </div>
      <button onclick="openMicrosoft()" class="w-full mt-8 bg-black text-white py-8 rounded-3xl text-2xl font-bold">Open Microsoft →</button>
    </div>

    <button onclick="startFlow()" id="startBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl text-xl font-bold">Start Connection</button>

    <!-- New error box -->
    <p id="errorBox" class="hidden text-red-500 text-center mt-6 text-sm"></p>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';

    async function startFlow() {
      document.getElementById('startBtn').innerHTML = 'Loading... Please wait';
      document.getElementById('errorBox').classList.add('hidden');

      const res = await fetch('/api/init-device-flow', { method: 'POST' });
      const data = await res.json();

      if (data.user_code) {
        // Success! Show the code
        document.getElementById('codeBox').value = data.user_code;
        document.getElementById('codeArea').classList.remove('hidden');
        document.getElementById('startBtn').classList.add('hidden');
      } else {
        // Show the real error
        document.getElementById('errorBox').textContent = data.error || 'Something went wrong. Check Render Logs!';
        document.getElementById('errorBox').classList.remove('hidden');
        document.getElementById('startBtn').innerHTML = 'Try Again';
      }
    }

    function copyCode() {
      const code = document.getElementById('codeBox').value;
      navigator.clipboard.writeText(code);
      alert('Code copied! 👍');
    }

    function openMicrosoft() {
      window.open('https://microsoft.com/devicelogin', '_blank');
    }
  </script>
</body>
</html>
